<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#fff8f2">
  <title>你画我猜</title>
  <link rel="stylesheet" href="./style.css">
  <script src="../runtime-bootstrap.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="brand-bar">
      <div class="brand-mark" aria-hidden="true">✎</div>
      <div><h1>你画我猜</h1><p>轮流画，抢先猜</p></div>
      <a class="club-link" href="../../index.html">返回 Club</a><button id="refresh" class="icon-button" type="button" aria-label="刷新">↻</button>
    </header>
    <div class="content-scroll">
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

      <section id="lobby" class="lobby">
        <div class="lobby-hero"><span class="eyebrow">DRAW &amp; GUESS</span><h2>灵感开场<br>默契接力</h2><p>轮流当画手，好友抢先猜。画得像不像不重要，大家看得懂才有趣。</p><div class="hero-tags"><span>3～8 人</span><span>实时画板</span><span>好友对局</span></div><div class="create-strip"><button type="button" data-create-room="casual" data-stake="0">休闲局</button><button type="button" data-create-room="coin" data-stake="5">5 币场</button><button type="button" data-create-room="coin" data-stake="10">10 币场</button><button type="button" data-create-room="coin" data-stake="20">20 币场</button></div></div>
        <div class="panel lobby-panel"><div class="section-heading"><div><span class="eyebrow">游戏大厅</span><h2>选择房间</h2></div><span class="rule-chip">3～8 人</span></div>
          <p class="muted">直接选择房间入座；摸鱼币场由最终第一名获得奖池，同分则平分。</p>
          <div id="rooms" class="room-list"></div>
        </div>
      </section>

      <section id="room-view" class="room-view" hidden>
        <div class="room-toolbar">
          <button id="back" class="icon-button" type="button" aria-label="返回大厅">←</button>
          <div class="room-heading">
            <span class="eyebrow" id="phase-label">候场中</span>
            <div class="room-title-row"><h2 id="room-title">候场房间</h2><code id="room-code">—</code></div>
          </div>
          <div class="room-toolbar-actions">
            <span id="timer" class="timer">--</span>
            <button id="draw-chat-toggle" class="chat-toggle" type="button" aria-controls="draw-chat" aria-expanded="false">聊天</button>
            <button id="room-refresh" class="icon-button" type="button" aria-label="刷新房间">↻</button>
          </div>
        </div>
        <div class="room-layout">
          <div class="game-column">
            <div class="round-strip"><span>当前进度</span><strong id="round-label">准备入座</strong></div>
            <section class="seats-panel" aria-labelledby="seats-title">
              <div class="seats-heading"><span class="eyebrow">玩家席位</span><strong id="seats-title">等待大家准备</strong></div>
              <div id="players" class="players" aria-label="玩家席位"></div>
            </section>

            <div class="stage-workspace">
              <section id="waiting" class="stage-card" hidden>
                <div id="waiting-copy"></div>
                <div id="claim-controls" class="inline-form" hidden><span>空位先到先得</span><button id="claim" class="primary" type="button">加入房间</button></div>
                <div id="seat-controls" class="action-row" hidden>
                  <button id="ready" class="secondary" type="button">准备</button>
                  <button id="start" class="primary" type="button">开始游戏</button>
                </div>
              </section>

              <section id="choosing" class="stage-card word-picker" hidden>
                <span class="eyebrow">画手选词</span><h3>选一个你最会画的</h3>
                <div id="word-cards" class="word-cards"></div>
                <p id="choose-wait" class="muted"></p>
              </section>

              <section id="play-area" class="play-layout" hidden>
                <div class="canvas-column">
                  <div class="canvas-frame"><canvas id="draw-canvas" width="960" height="720" aria-label="绘画画布"></canvas></div>
                  <div id="drawing-tools" class="drawing-tools" hidden>
                    <div class="tool-group" aria-label="画笔颜色">
                      <button class="color active" data-color="#222222" style="--swatch:#222222" aria-label="黑色"></button>
                      <button class="color" data-color="#ef5b5b" style="--swatch:#ef5b5b" aria-label="红色"></button>
                      <button class="color" data-color="#f59e0b" style="--swatch:#f59e0b" aria-label="橙色"></button>
                      <button class="color" data-color="#22a06b" style="--swatch:#22a06b" aria-label="绿色"></button>
                      <button class="color" data-color="#3b82f6" style="--swatch:#3b82f6" aria-label="蓝色"></button>
                      <button class="color" data-color="#8b5cf6" style="--swatch:#8b5cf6" aria-label="紫色"></button>
                    </div>
                    <div class="tool-group">
                      <button class="tool active" data-width="0.008" type="button">画笔</button>
                      <button class="tool" id="eraser" type="button">橡皮</button>
                      <button class="tool" id="undo" type="button">撤销</button>
                      <button class="tool danger" id="clear" type="button">清空</button>
                    </div>
                  </div>
                </div>
              </section>

              <section id="reveal" class="stage-card reveal" hidden></section>
              <section id="ranking" class="stage-card ranking" hidden></section>
            </div>
          </div>

          <aside id="draw-chat" class="chat-column">
            <div class="chat-heading"><div><span class="eyebrow">房间聊天</span><h3 id="prompt">和群友聊两句</h3></div><div class="chat-heading-actions"><span id="word-hint" class="word-hint"></span><button id="draw-chat-close" type="button" aria-label="收起聊天">收起</button></div></div>
            <div id="messages" class="messages" aria-live="polite"></div>
            <div class="composer">
              <p id="input-reason" class="input-reason"></p>
              <div class="inline-form">
                <input id="chat-input" maxlength="100" placeholder="输入消息或答案" autocomplete="off">
                <button id="chat-send" class="primary" type="button">发送</button>
              </div>
            </div>
          </aside>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
