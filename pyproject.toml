[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dzmm-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "playwright>=1.49,<2",
    "python-socketio[client]>=5,<6",
    "python-multipart>=0.0.20,<1",
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7,<1",
    "PyJWT[crypto]>=2.8,<3",
    "opencc-python-reimplemented==0.1.7",
    "mahjong==2.0.0",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dzmm = ["playwright>=1.49,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
dzmm-read = "dzmm_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dzmm_bot = ["admin/static/*.css", "admin/static/*.js", "admin/templates/*.html", "admin/static/workstation/*.png"]
